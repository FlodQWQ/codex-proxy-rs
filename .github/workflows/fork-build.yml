name: Fork Build

on:
  push:
    branches: [main, cpr-custom]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'release/version.yaml'
      - 'deploy/update-cpr.sh'
      - 'deploy/test-update-cpr.py'
      - 'deploy/install-modeltrace.sh'
      - 'deploy/migrate-cpr-config.py'
      - 'deploy/test-migrate-cpr-config.py'
      - '.github/workflows/fork-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FORK_RELEASE_SEQUENCE: '6'
  MODELTRACE_REVISION: '55a2e4a55170423b484d701e9a82ab62b268c811'

jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:18-bookworm@sha256:d9c83446333daec3f0588cc709adb80c26090b7f9f0f7ec8d43c243385d79818
        env:
          POSTGRES_DB: codex_proxy
          POSTGRES_USER: codex_proxy
          POSTGRES_PASSWORD: codex_proxy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codex_proxy -d codex_proxy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout pinned ModelTrace source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/xqy2006/ModelTrace.git "$RUNNER_TEMP/modeltrace"
          git -C "$RUNNER_TEMP/modeltrace" fetch --depth 1 origin "$MODELTRACE_REVISION"
          git -C "$RUNNER_TEMP/modeltrace" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/modeltrace" rev-parse HEAD)" = "$MODELTRACE_REVISION"
          test -s "$RUNNER_TEMP/modeltrace/data/unified_bank.json"
          test -s "$RUNNER_TEMP/modeltrace/challenge_suite.py"
          test -s "$RUNNER_TEMP/modeltrace/fingerprint.py"
          test -z "$(git -C "$RUNNER_TEMP/modeltrace" ls-files -s | awk '$1 == 120000 { print; exit }')"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend format:check
          pnpm --dir frontend build

      - name: Test manual updater
        run: |
          bash -n deploy/update-cpr.sh
          python3 deploy/test-update-cpr.py
          python3 deploy/test-migrate-cpr-config.py

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: fork-bookworm-rust198-${{ hashFiles('backend/Cargo.lock', 'backend/**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            fork-bookworm-rust198-${{ hashFiles('backend/Cargo.lock', 'backend/**/Cargo.toml') }}-

      # Debian 12 构建环境避免产物依赖服务器没有的新版 glibc。
      - name: Build Linux binary
        env:
          CPR_GIT_SHA: ${{ github.sha }}
          CPR_BUILD_TYPE: release
        run: |
          mkdir -p "$HOME/.cargo" dist/web
          version=$(ruby -ryaml -e 'puts YAML.load_file("release/version.yaml").fetch("version").delete_prefix("v")')
          version="${version}-Flod-fork.${FORK_RELEASE_SEQUENCE}"
          echo "FORK_VERSION=$version" >> "$GITHUB_ENV"
          docker run --rm --network host --user "$(id -u):$(id -g)" \
            -e CARGO_HOME=/cargo -e HOME=/tmp \
            -e CPR_TEST_DATABASE_URL=postgres://codex_proxy:codex_proxy@127.0.0.1:5432/codex_proxy \
            -e CPR_VERSION="$version" \
            -e CPR_GIT_SHA -e CPR_BUILD_TYPE \
            -e CPR_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -v "$HOME/.cargo:/cargo" -v "$PWD:/workspace" \
            -w /workspace/backend \
            rust:1.98-bookworm@sha256:828077e0f5ed0401fbd9cb5b4d5dedca23bd13c7fe032f3e8b7313e7acd2a57f \
            sh -c 'cargo +1.98.0 build --release --locked --bin codex-proxy-rs && RUST_MIN_STACK=16777216 cargo +1.98.0 test --release --locked -p gateway-host --test main system_update && RUST_MIN_STACK=16777216 cargo +1.98.0 test --release --locked -p provider-openai --test main && RUST_MIN_STACK=16777216 cargo +1.98.0 test --release --locked -p gateway-api --test main admin::accounts && RUST_MIN_STACK=16777216 cargo +1.98.0 test --release --locked -p gateway-api --lib user_cost_tests && RUST_MIN_STACK=16777216 cargo +1.98.0 test --release --locked -p gateway-admin --test main use_case::accounts && RUST_MIN_STACK=16777216 cargo +1.98.0 test --release --locked -p gateway-store --test main postgres::provider_accounts'
          install -m755 backend/target/release/codex-proxy-rs dist/codex-proxy-rs
          cd backend/crates/providers/openai/ticket-probe
          GOTOOLCHAIN=go1.27.0 CGO_ENABLED=0 go test ./...
          GOTOOLCHAIN=go1.27.0 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o ../../../../../dist/codex-ticket-probe .
          cd ../../../../..
          cp -a backend/crates/providers/openai/ticket-probe dist/ticket-probe-source
          mkdir -p dist/modeltrace
          cp -a "$RUNNER_TEMP/modeltrace/." dist/modeltrace/
          printf '%s\n' "$MODELTRACE_REVISION" > dist/modeltrace/.git/CPR_REVISION
          cp -a frontend/dist dist/web/dist
          printf '%s\n' "$GITHUB_SHA" > dist/REVISION
          printf '%s\n' "$version" > dist/VERSION
          mkdir -p dist/deploy
          cp deploy/update-cpr.sh dist/deploy/update-cpr.sh
          cp deploy/migrate-cpr-config.py dist/deploy/migrate-cpr-config.py
          tar -czf codex-proxy-rs-linux-amd64.tar.gz -C dist .
          sha256sum codex-proxy-rs-linux-amd64.tar.gz > SHA256SUMS

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-proxy-rs-linux-amd64-${{ github.sha }}
          path: |
            codex-proxy-rs-linux-amd64.tar.gz
            SHA256SUMS
            deploy/update-cpr.sh
            deploy/migrate-cpr-config.py
          if-no-files-found: error
          retention-days: 14

      # 仅定制分支发布独立 fork 通道，不触碰上游或 fork 的稳定版入口。
      - name: Publish fork assets
        if: github.ref == 'refs/heads/cpr-custom' && github.repository == 'FlodQWQ/codex-proxy-rs'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${FORK_VERSION}"
          printf '定制分支：cpr-custom\n提交：%s\n\n支持网页立即更新完整定制包，更新后点击重启服务。旧版本首次仍需手动安装并配置更新目录权限及重启方式。手动更新可下载压缩包、SHA256SUMS 和 update-cpr.sh，先运行 --check，再运行 --apply。\n\n升级前请备份数据库并阅读 deploy/FORK-UPDATES.md。\n' "$GITHUB_SHA" > fork-notes.md
          if head -n1 release/notes.md | grep -Fxq "# $tag"; then
            printf '\n' >> fork-notes.md
            cat release/notes.md >> fork-notes.md
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite published assets" >&2
            exit 1
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "$tag (cpr-custom)" --notes-file fork-notes.md \
            codex-proxy-rs-linux-amd64.tar.gz SHA256SUMS deploy/update-cpr.sh deploy/migrate-cpr-config.py
